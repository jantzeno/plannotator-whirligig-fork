name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - whirligig
  push:
    branches:
      - whirligig

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library packages
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate shared runtime mirrors
        run: bash apps/pi-extension/vendor.sh

      - name: Type-check library packages
        run: bun run typecheck:library

      - name: Run library unit tests
        run: bun run test:library

      - name: Run overlay and mobile DOM regressions
        run: bun run test:library:dom
